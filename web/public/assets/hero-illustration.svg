<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" fill="none">
<defs>
 <linearGradient id="book" x1="120" y1="260" x2="490" y2="390" gradientUnits="userSpaceOnUse">
   <stop stop-color="#0878F9"/>
   <stop offset="1" stop-color="#082B62"/>
 </linearGradient>
 <linearGradient id="book-lower" x1="70" y1="350" x2="490" y2="450" gradientUnits="userSpaceOnUse">
   <stop stop-color="#1457B8"/>
   <stop offset="1" stop-color="#071426"/>
 </linearGradient>
 <linearGradient id="paper" x1="280" y1="70" x2="480" y2="300" gradientUnits="userSpaceOnUse">
   <stop stop-color="#FFFFFF"/>
   <stop offset="1" stop-color="#E8F2FF"/>
 </linearGradient>
 <linearGradient id="glow" x1="120" y1="80" x2="530" y2="430" gradientUnits="userSpaceOnUse">
   <stop stop-color="#12BCEB" stop-opacity=".22"/>
   <stop offset="0.6" stop-color="#0878F9" stop-opacity=".12"/>
   <stop offset="1" stop-color="#0878F9" stop-opacity="0"/>
 </linearGradient>
 <filter id="shadow" x="30" y="30" width="570" height="430" filterUnits="userSpaceOnUse">
   <feGaussianBlur stdDeviation="20"/>
 </filter>
</defs>
<ellipse cx="328" cy="388" rx="230" ry="50" fill="#0878F9" opacity=".18" filter="url(#shadow)"/>
