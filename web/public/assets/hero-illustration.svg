<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 820 650" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">StudyHub academic resource discovery</title>
  <desc id="desc">A premium blue and navy laptop displaying an academic resource search interface, with layered books and floating document cards.</desc>
  <defs>
    <linearGradient id="deviceShell" x1="220" y1="70" x2="650" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#254F87"/>
      <stop offset=".42" stop-color="#0E2B54"/>
      <stop offset="1" stop-color="#061A36"/>
    </linearGradient>
    <linearGradient id="deviceEdge" x1="250" y1="430" x2="675" y2="495" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B9D4F5"/>
      <stop offset=".28" stop-color="#4776AF"/>
      <stop offset=".72" stop-color="#183C6A"/>
      <stop offset="1" stop-color="#A8C7EA"/>
    </linearGradient>
    <linearGradient id="screen" x1="245" y1="92" x2="624" y2="405" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF5FF"/>
    </linearGradient>
    <linearGradient id="blue" x1="325" y1="170" x2="600" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1594FF"/>
      <stop offset="1" stop-color="#0755C9"/>
    </linearGradient>
    <linearGradient id="cyan" x1="120" y1="210" x2="260" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#47E2F4"/>
      <stop offset="1" stop-color="#078AEF"/>
    </linearGradient>
    <linearGradient id="bookTop" x1="102" y1="455" x2="403" y2="565" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A8EFF"/>
      <stop offset=".55" stop-color="#075FCB"/>
      <stop offset="1" stop-color="#073D8D"/>
    </linearGradient>
    <linearGradient id="bookSide" x1="120" y1="510" x2="408" y2="603" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9FCFF"/>
      <stop offset=".5" stop-color="#D8E7F8"/>
      <stop offset="1" stop-color="#9FB9D9"/>
    </linearGradient>
    <linearGradient id="bookTop2" x1="200" y1="420" x2="468" y2="515" gradientUnits="userSpaceOnUse">
      <stop stop-color="#25C9E8"/>
      <stop offset=".48" stop-color="#0879E8"/>
      <stop offset="1" stop-color="#073B84"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFD36B"/><stop offset="1" stop-color="#F59C16"/>
    </linearGradient>
    <radialGradient id="ambientBlue" cx="0" cy="0" r="1" gradientTransform="matrix(280 0 0 235 430 290)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#27B8FF" stop-opacity=".25"/>
      <stop offset="1" stop-color="#27B8FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientCyan" cx="0" cy="0" r="1" gradientTransform="matrix(180 0 0 180 205 412)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17D2E5" stop-opacity=".22"/>
      <stop offset="1" stop-color="#17D2E5" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadowLarge" x="80" y="30" width="700" height="600" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="shadowCard" x="-40%" y="-40%" width="180%" height="190%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#0A3266" flood-opacity=".18"/>
    </filter>
    <filter id="shadowBook" x="-30%" y="-30%" width="160%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#06234B" flood-opacity=".22"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="screenClip"><rect x="246" y="83" width="380" height="320" rx="17"/></clipPath>
  </defs>

  <!-- Atmospheric light: transparent canvas, so this works on both site themes. -->
  <ellipse cx="432" cy="315" rx="315" ry="260" fill="url(#ambientBlue)"/>
  <ellipse cx="224" cy="432" rx="205" ry="172" fill="url(#ambientCyan)"/>
  <ellipse cx="430" cy="548" rx="302" ry="47" fill="#0B4B91" opacity=".13" filter="url(#shadowLarge)"/>

  <!-- Subtle orbit rings create depth without becoming decorative clutter. -->
  <path d="M105 336C135 192 263 91 425 85c106-4 194 33 254 98" stroke="#42C6F4" stroke-opacity=".2" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 12"/>
  <path d="M126 385c28 117 137 194 270 195 91 1 169-30 222-86" stroke="#168BEB" stroke-opacity=".16" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 13"/>

  <!-- Rear floating document sheet. -->
  <g transform="rotate(8 655 208)" filter="url(#shadowCard)">
    <rect x="586" y="115" width="142" height="190" rx="18" fill="#DCEBFB" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="606" y="138" width="43" height="48" rx="11" fill="#E64F59"/>
    <path d="M618 151h18l-2 20h-14l-2-20Z" fill="white" opacity=".95"/>
    <path d="M621 147h12v7h-12z" fill="white" opacity=".95"/>
    <rect x="660" y="145" width="48" height="8" rx="4" fill="#8AA9D0"/>
    <rect x="660" y="161" width="37" height="6" rx="3" fill="#B4C8E0"/>
    <rect x="606" y="202" width="102" height="7" rx="3.5" fill="#B5C9E2"/>
    <rect x="606" y="219" width="84" height="7" rx="3.5" fill="#C7D7E9"/>
    <rect x="606" y="247" width="102" height="7" rx="3.5" fill="#B5C9E2"/>
    <rect x="606" y="264" width="65" height="7" rx="3.5" fill="#C7D7E9"/>
  </g>

  <!-- Laptop screen and chassis. -->
  <g transform="rotate(-3 435 255)" filter="url(#shadowCard)">
    <rect x="224" y="59" width="424" height="374" rx="28" fill="url(#deviceShell)" stroke="#80B8F0" stroke-opacity=".55" stroke-width="2"/>
    <rect x="236" y="71" width="400" height="350" rx="21" fill="#061A35"/>
    <rect x="246" y="83" width="380" height="320" rx="17" fill="url(#screen)"/>
    <g clip-path="url(#screenClip)">
      <rect x="246" y="83" width="380" height="44" fill="#FFFFFF"/>
      <!-- Small clean wordmark mark. -->
      <rect x="263" y="96" width="20" height="20" rx="6" fill="#0878F9"/>
      <path d="M267 103h12M267 108h12M267 113h8" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      <text x="291" y="111" fill="#102A50" font-family="Arial, sans-serif" font-size="12" font-weight="700">StudyHub</text>
      <circle cx="582" cy="105" r="4" fill="#D2DFEF"/>
      <circle cx="597" cy="105" r="4" fill="#D2DFEF"/>
      <circle cx="612" cy="105" r="4" fill="#D2DFEF"/>
      <path d="M246 127h380" stroke="#E5EDF7"/>

      <text x="270" y="157" fill="#7E91AA" font-family="Arial, sans-serif" font-size="8" font-weight="700" letter-spacing="1.2">ACADEMIC RESOURCE LIBRARY</text>
      <text x="270" y="182" fill="#102A50" font-family="Arial, sans-serif" font-size="19" font-weight="700">Find your next resource.</text>
      <text x="270" y="198" fill="#71849D" font-family="Arial, sans-serif" font-size="9">Search notes, exams and course materials.</text>

      <!-- Search field -->
      <rect x="269" y="211" width="334" height="38" rx="10" fill="#FFFFFF" stroke="#D8E5F4"/>
      <circle cx="284" cy="228" r="5.5" stroke="#1687ED" stroke-width="1.8"/>
      <path d="m288 232 4 4" stroke="#1687ED" stroke-width="1.8" stroke-linecap="round"/>
      <text x="300" y="231" fill="#9AAAC0" font-family="Arial, sans-serif" font-size="9">Search a course or topic...</text>
      <rect x="548" y="216" width="48" height="28" rx="7" fill="url(#blue)"/>
      <text x="572" y="234" fill="white" font-family="Arial, sans-serif" font-size="8" font-weight="700" text-anchor="middle">Search</text>

      <text x="270" y="271" fill="#526B8B" font-family="Arial, sans-serif" font-size="9" font-weight="700">RECENTLY DISCOVERED</text>
      <!-- Resource row 1 -->
      <rect x="269" y="281" width="334" height="48" rx="9" fill="#FFFFFF" stroke="#E2EAF5"/>
      <rect x="279" y="290" width="27" height="30" rx="7" fill="#FFF0F0"/>
      <text x="292.5" y="309" fill="#DD4A55" font-family="Arial, sans-serif" font-size="8" font-weight="700" text-anchor="middle">PDF</text>
      <text x="315" y="300" fill="#1A355B" font-family="Arial, sans-serif" font-size="9" font-weight="700">Database Systems — Final Exam</text>
      <text x="315" y="314" fill="#8496AE" font-family="Arial, sans-serif" font-size="7.5">Past examination · Computer Science</text>
      <circle cx="584" cy="305" r="8" fill="#E7F3FF"/>
      <path d="m581 305 2 2 4-5" stroke="#0878F9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Resource row 2 -->
      <rect x="269" y="337" width="334" height="48" rx="9" fill="#FFFFFF" stroke="#E2EAF5"/>
      <rect x="279" y="346" width="27" height="30" rx="7" fill="#FFF4E5"/>
      <text x="292.5" y="365" fill="#D98727" font-family="Arial, sans-serif" font-size="8" font-weight="700" text-anchor="middle">PPT</text>
      <text x="315" y="356" fill="#1A355B" font-family="Arial, sans-serif" font-size="9" font-weight="700">Data Structures &amp; Algorithms</text>
      <text x="315" y="370" fill="#8496AE" font-family="Arial, sans-serif" font-size="7.5">Lecture slides · Study materials</text>
      <circle cx="584" cy="361" r="8" fill="#E7F3FF"/>
      <path d="m581 361 2 2 4-5" stroke="#0878F9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <circle cx="436" cy="76" r="2.5" fill="#5C7FA8"/>
    <!-- Laptop lower lip -->
    <path d="M210 431h452l48 39c5 4 2 12-5 13H171c-8 0-11-9-5-14l44-38Z" fill="url(#deviceEdge)" stroke="#D5E7FA" stroke-opacity=".7" stroke-width="1.5"/>
    <path d="M220 435h432l30 28H188l32-28Z" fill="#0D2A50" opacity=".42"/>
    <path d="M372 438h118l-12 13h-94l-12-13Z" fill="#A5C2E2" opacity=".6"/>
    <path d="M373 438h116" stroke="#E4F0FD" stroke-opacity=".6" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- A compact source card floating at the upper right. -->
  <g transform="rotate(7 687 370)" filter="url(#shadowCard)">
    <rect x="631" y="330" width="142" height="82" rx="15" fill="#FFFFFF" stroke="#DCEAF8"/>
    <circle cx="654" cy="356" r="11" fill="#E2F7F0"/>
    <path d="M649 356h10M654 351v10" stroke="#18A879" stroke-width="1.8" stroke-linecap="round"/>
    <text x="674" y="354" fill="#24466F" font-family="Arial, sans-serif" font-size="9" font-weight="700">Useful sources</text>
    <text x="674" y="369" fill="#8799B0" font-family="Arial, sans-serif" font-size="7.5">University channels</text>
    <rect x="648" y="387" width="104" height="5" rx="2.5" fill="#E7EEF7"/>
    <rect x="648" y="387" width="75" height="5" rx="2.5" fill="#20C98B"/>
  </g>

  <!-- Layered study books at the lower left; realistic page edges and cover depth. -->
  <g filter="url(#shadowBook)">
    <!-- Bottom volume -->
    <path d="M73 493 294 449l174 53-228 57-167-66Z" fill="url(#bookTop)"/>
    <path d="m73 493 167 66v24L73 515v-22Z" fill="url(#bookSide)"/>
    <path d="m240 559 228-57v23l-228 58v-24Z" fill="#91ACCC"/>
    <path d="m91 495 146 58" stroke="#FFFFFF" stroke-opacity=".75" stroke-width="2"/>
    <path d="m104 490 145 58" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="1.5"/>
    <path d="m245 557 205-51" stroke="#EAF4FF" stroke-opacity=".55" stroke-width="1.5"/>
    <!-- Upper volume -->
    <path d="m117 440 188-38 149 45-197 48-140-55Z" fill="url(#bookTop2)"/>
    <path d="m117 440 140 55v19l-140-54v-20Z" fill="#E5F0FC"/>
    <path d="m257 495 197-48v19l-197 48v-19Z" fill="#9DB8D8"/>
    <path d="m132 440 120 47 174-43" stroke="#BDEFFD" stroke-width="2" stroke-linecap="round" opacity=".8"/>
    <path d="m153 435 111 44 139-34" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity=".65"/>
    <!-- Small bookmark detail -->
    <path d="m387 409 14-3v27l-7-5-7 8v-27Z" fill="url(#gold)"/>
  </g>

  <!-- Floating file chips add a sense of discovery. -->
  <g filter="url(#shadowCard)" transform="rotate(-8 133 285)">
    <rect x="73" y="247" width="112" height="70" rx="14" fill="#FFFFFF" stroke="#D9E9F8"/>
    <rect x="86" y="260" width="31" height="40" rx="8" fill="#FFF0F0"/>
    <text x="101.5" y="284" fill="#E34F59" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">PDF</text>
    <rect x="126" y="264" width="43" height="6" rx="3" fill="#7999C0"/>
    <rect x="126" y="277" width="34" height="5" rx="2.5" fill="#C0D0E4"/>
    <rect x="126" y="289" width="39" height="5" rx="2.5" fill="#C0D0E4"/>
  </g>

  <!-- Fine luminous accents, kept restrained. -->
  <circle cx="691" cy="286" r="5" fill="#FFB21A"/>
  <circle cx="698" cy="286" r="12" fill="#FFB21A" opacity=".18" filter="url(#glow)"/>
  <path d="m157 196 8-16 8 16M145 220h23" stroke="#13BCEB" stroke-width="4" stroke-linecap="round"/>
  <circle cx="561" cy="516" r="4" fill="#20C98B"/>
  <circle cx="561" cy="516" r="11" fill="#20C98B" opacity=".16" filter="url(#glow)"/>
</svg>
